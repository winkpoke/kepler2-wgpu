[package]
name = "kepler-wgpu"
version = "0.17.0"
edition = "2021"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Runtime / utility
log = "0.4"
env_logger = "0.11"
cfg-if = "1"
anyhow = "1"
thiserror = "1"
num = "0.4"
num-traits = "0.2"
byteorder = "1"
hex = "0.4"
paste = "1"
once_cell = "1"
async-lock = "3"
async-trait = "0.1"
futures = "0.3"
# Math / memory
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1.16", features = ["derive"] }
half = "2"
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
# Time / ID
chrono = "0.4"
uuid = { version = "1.18", default-features = false, features = ["v4"] }
# DICOM
dicom-object = "0.8.2"
dicom-core = "0.8.2"
dicom-dictionary-std = "0.8"
# Array / image
ndarray = "0.15"
# Window / input abstraction
winit = { version = "0.29.15", features = ["rwh_05"] }
# Data / geometry / mesh
mcubes = "0.1"
lin_alg = "1.3"
tobj = "4"
# GPU
wgpu = "23.0.0"

[dependencies.image]
version = "0.25.2"
default-features = false
features = ["png", "jpeg"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Async runtime / server
tokio = { version = "1.47.1", features = ["full", "process"] }
axum = { version = "0.7", features = ["ws", "multipart"] }
# HTTP
http-body-util = "0.1.3"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart", "stream"] }
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
# Serial / device
serialport = "4.3"
tokio-serial = "5"
# Parallel / synchronization
rayon = "1.11.0"
parking_lot = "0.12"
crossbeam-channel = "0.5"
# File / archive
zip = "4"
walkdir = "2"
tokio-util = { version = "0.7", features = ["io"] }
# Native-only utilities
base64 = "0.22"
ort = { version = "2.0.0-rc.4", features = ["ndarray", "download-binaries", "directml"] }
tokio-modbus = {version = "0.17", default-features = false, features = ["tcp"]}
wgpu30 = { package = "wgpu", version = "30", default-features = false, features = ["vulkan", "metal", "gles", "wgsl"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# GPU
wgpu = { version = "23.0", features = ["webgl"] }
# WASM bindings
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.30"
serde-wasm-bindgen = "0.6"
# WASM logging / panic
console_error_panic_hook = "0.1.6"
console_log = "1.0"
# Browser
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "File",
    "FileReader",
    "ProgressEvent",
    "console"
 ]}
js-sys = "0.3.22"
# WASM UUID / random
uuid = { version = "1.18.1", features = ["js"] }
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
mockall = "0.13"
proptest = "1.4"
cargo-llvm-cov = "0.5"
naga = { version = "22", features = ["wgsl-in"] }
quickcheck = "1.0"

[features]
default = []
trace-logging = []

[[bin]]
name = "kepler"
path = "src/main.rs"
