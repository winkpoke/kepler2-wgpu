name: Repository Rust toolchain
description: Install repository-pinned Rust and components.
outputs:
  toolchain:
    description: Exact stable compiler release.
    value: ${{ steps.config.outputs.toolchain }}
  coverage-cli-version:
    description: Exact compatible cargo-llvm-cov CLI release.
    value: ${{ steps.config.outputs.coverage-cli-version }}
runs:
  using: composite
  steps:
    - name: Resolve repository compiler
      id: config
      shell: bash
      run: >-
        python3 scripts/ci_toolchain.py --github-output "$GITHUB_OUTPUT"
        --coverage-output "$GITHUB_OUTPUT"
    - name: Install declared Rust toolchain
      # Verified against upstream master; installer pin is not the compiler pin.
      uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
      with:
        toolchain: ${{ steps.config.outputs.toolchain }}
        components: ${{ steps.config.outputs.components }}
        targets: ${{ steps.config.outputs.targets }}
    - name: Verify active compiler
      shell: bash
      env:
        EXPECTED_TOOLCHAIN: ${{ steps.config.outputs.toolchain }}
      run: |
        rustup show active-toolchain
        rustc -Vv
        actual=$(rustc -Vv | awk '/^release:/ {print $2}')
        test "$actual" = "$EXPECTED_TOOLCHAIN"
