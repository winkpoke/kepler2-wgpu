name: Rust Platform Checks

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: native-types
            native: true
            command: cargo check --locked --all-targets
          - check: library-tests
            native: true
            command: cargo test --locked --lib
          - check: wasm-library-types
            native: false
            command: >-
              cargo check --locked --lib --target wasm32-unknown-unknown
          - check: formatting
            native: false
            command: cargo fmt -- --check
          - check: strict-clippy
            native: true
            command: cargo clippy --locked --all-targets -- -D warnings
    env:
      WGPU_BACKEND: vulkan
      KEPLER_REQUIRE_GPU_TESTS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        id: rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        if: matrix.check != 'formatting'
        with:
          shared-key: ${{ matrix.check }}-${{ steps.rust.outputs.toolchain }}
      - name: Install native dependencies and software Vulkan
        if: matrix.native
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libxkbcommon-dev \
            libwayland-dev libvulkan1 mesa-vulkan-drivers
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          runtime="$RUNNER_TEMP/kepler-gpu-runtime"
          mkdir -p "$runtime"
          chmod 700 "$runtime"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
      - name: Run check
        run: ${{ matrix.command }}
