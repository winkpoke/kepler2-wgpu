name: Coverage Report

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly

      - name: Install cargo-llvm-cov
        run: |
          cargo install cargo-llvm-cov

      - name: Install native dependencies and headless GPU driver
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libxkbcommon-dev \
            libwayland-dev libvulkan1 mesa-vulkan-drivers
          echo "WGPU_BACKEND=vulkan" >> "$GITHUB_ENV"
          echo "KEPLER_REQUIRE_GPU_TESTS=1" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Generate coverage report
        run: |
          mkdir -p coverage
          cargo llvm-cov --locked --lcov --output-path coverage/lcov.info
          cargo llvm-cov report --html --output-dir coverage

      - name: Upload to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true

      - name: Store coverage artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-report
          path: coverage/
