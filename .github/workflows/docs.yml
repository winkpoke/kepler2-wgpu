name: Documentation Contracts

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENSPEC_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned documentation tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check maintenance-script regressions
        run: npm run docs:test
      - name: Check current links and pending delta identities
        run: npm run docs:check
      - name: Validate baseline specs and active changes
        run: npm run specs:check
